common:
  tags:
    - drivers
    - sensor
    - bh_arc_telem

tests:
  drivers.sensor.bh_arc_telem.native_sim:
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
    extra_args:
      - DTC_OVERLAY_FILE=boards/native_sim.overlay
      - EXTRA_CONF_FILE=../../../../app/dmc/boards/native_sim.conf
  drivers.sensor.bh_arc_telem.native_sim.ubsan:
    platform_allow:
      - native_sim
    extra_args:
      - DTC_OVERLAY_FILE=boards/native_sim.overlay
      - EXTRA_CONF_FILE=../../../../app/dmc/boards/native_sim.conf
    extra_configs:
      # Misaligned accesses do not fault on x86: trap on them instead
      - CONFIG_UBSAN=y
      - CONFIG_UBSAN_TRAP=y
