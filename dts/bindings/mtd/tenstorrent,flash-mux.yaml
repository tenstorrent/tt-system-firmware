description: |
  Runtime-selected flash configuration multiplexer.

  Presents a single flash device backed by one of several candidate flash
  devices. The candidates describe the same physical flash chip under
  different configurations - one node per supported second-source part,
  distinguished by the jedec-id property, plus exactly one catch-all
  that omits jedec-id. They are the zephyr,deferred-init children of
  candidate-bus.

  At init the mux initializes the catch-all, reads the chip's JEDEC ID
  through it, and initializes the candidate whose jedec-id matches,
  falling back to the catch-all if none matches or its initialization
  fails. All flash API calls are forwarded to the selected candidate.

  Candidates sharing a bus position are distinct devices to the bus
  controller, so give their bus the software-multiperipheral property:
  the controller is then reconfigured whenever a different device
  accesses it.

compatible: "tenstorrent,flash-mux"

include: base.yaml

properties:
  candidate-bus:
    type: phandle
    required: true
    description: |
      Bus whose zephyr,deferred-init children are the candidates. They
      are not referenced directly, as a non-deferred device cannot
      depend on deferred ones.
