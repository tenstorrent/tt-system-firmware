description: |
  MSI catcher FIFO block. Register layout within the region:
  - offset 0: FIFO pop/push
  - offset 4: flush (read to clear)
  - offset 8: status

compatible: "tenstorrent,msi-catcher"

include: base.yaml

properties:
  reg:
    required: true
