compatible: "tenstorrent,bh-reset"

include: [base.yaml, reset-controller.yaml]

description: |
  Tenstorrent Blackhole Reset Controller

  The Tenstorrent Blackhole reset controller is used to manage one bank of reset signals occupying
  a 32-bit memory-mapped address. Reset lines are active-low (bit clear asserts reset).

  There are 3 usage modes.

  1. no mask is specified - 32 reset lines are available to the reset controller instance

    resetX: reset@abcd1234 {
        compatible = "tenstorrent,bh-reset";
        reg = <0xabcd1234 0x4>;
        #reset-cells = <1>;
        status = "okay";
    };

  2. a mask is specified. Only the bits (id values) set high in the mask are valid. In the
    example below, id 1 and id 6 are valid.

    resetX: reset@abcd1234 {
        compatible = "tenstorrent,bh-reset";
        reg = <0xabcd1234 0x4>;
        #reset-cells = <1>;
        reset-mask = <0x42>;
        status = "okay";
    };

  3. a number of resets is specified. In the example below, the least-significant 3 bits are
     available to the reset controller instance. So id 0, id 1, and id 2 are valid.

    resetX: reset@abcd1234 {
        compatible = "tenstorrent,bh-reset";
        reg = <0xabcd1234 0x4>;
        #reset-cells = <1>;
        nresets = <3>;
        status = "okay";
    };

  If neither nresets, nor reset-mask is specified, then all 32 reset lines are available.

  Maximally one of nresets or reset-mask may be specified.

  Dual-field registers (eth, ddr, l2cpu) use a single node with reset-mask covering both the
  tile and RISC halves. Line IDs are physical bit indices; see
  include/zephyr/dt-bindings/reset/tt-bh-reset.h for helpers (TT_BH_ETH_TILE_ID, TT_BH_ETH_RISC_ID,
  etc.).

  Example eth_reset (tile bits [13:0], RISC bits [29:16]):

    eth_reset: reset@80030008 {
        compatible = "tenstorrent,bh-reset";
        reg = <0x80030008 0x4>;
        #reset-cells = <1>;
        reset-mask = <0x3fff3fff>;
        status = "okay";
    };


properties:
  reg:
    required: true

  nresets:
    type: int
    description: |
      The number of reset lines associated with the reset controller instance.

      This parameter is useful when the lines associated with the reset controller instance are
      contiguous, beginning at bit 0.

      I.e. for nresets = <5>, the value written to the reset register would be equivalent to
      BIT_MASK(5), or 0x1f.

      The valid range for nresets is 0 <= nresets <= 32.

  reset-mask:
    type: int
    description: |
      The bitmask of valid reset line ids for this controller instance.

      This parameter is useful when the lines associated with the reset controller instance are
      non-contiguous, or when a dual-field register exposes tile and RISC halves in one word.

      I.e. for reset-mask = <0x3fff3fff>, tile ids 0..13 and RISC ids 16..29 are valid.

  "#reset-cells":
    const: 1

reset-cells:
- id
