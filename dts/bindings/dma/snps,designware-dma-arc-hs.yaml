description: |
  Synopsys Designware ARC DMA Controller

  The driver supports both interrupt-driven and polling modes. When interrupts
  are provided in the device tree, the driver uses interrupt mode for better
  performance. When interrupts are not provided, the driver automatically
  falls back to polling mode using a work queue mechanism.

compatible: "snps,designware-dma-arc-hs"

include: [dma-controller.yaml, base.yaml]

properties:
  "#dma-cells":
    const: 1

  interrupts:
    description: |
      Optional interrupt for DMA transfer completion notifications.
      If not provided, the driver will operate in polling mode.

  dma-channels:
    type: int
    default: 16
    description: |
      Number of DMA channels supported by the DMA server.

  dma-descriptors:
    type: int
    default: 256
    description: |
      Number of DMA descriptors supported by the DMA server.

  max-burst-size:
    type: int
    default: 4
    description: |
      Maximum burst size supported by the DMA server.

  max-pending-transactions:
    type: int
    default: 4
    description: |
      Maximum number of pending bus transactions supported by the DMA server.

  buffer-size:
    type: int
    default: 16
    description: |
      DMA server data buffer size in word entries.

  dma-max-block-size:
    type: int
    default: 65536
    description: |
      Maximum size in bytes that can be transferred in a single block.
      This is typically limited by the hardware length register width.
      For 16-bit length register, max is 65536 (2^16) bytes.

  coherency-support:
    type: boolean
    description: |
      Enable coherency check for all L1 caches within the cluster by hardware.

  buffer-address-alignment:
    type: int
    default: 4
    description: |
      Required alignment in bytes for buffer addresses (source and destination).
      This is typically 4 bytes (32-bit word aligned) for ARC HS DMA.
