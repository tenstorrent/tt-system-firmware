      - name: Subtest summary
        if: ${{ always() }}
        run: |
          rc=0
          for m in "${{ github.workspace }}"/telemetry_output/*/manifest.json; do
            [ -f "$m" ] || continue
            st=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('status',''))" "$m")
            printf '%-26s %s\n' "$(basename "$(dirname "$m")")" "$st"
            [ "$st" = "failed" ] && rc=1
          done
          exit $rc

      - name: Cleanup
        if: ${{ always() }}
        run: |
          rm -rf "${{ github.workspace }}/telemetry_output" "$VENV_DIR" || true
