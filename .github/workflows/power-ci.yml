              models/tt_transformers/demo/simple_text_demo.py -k "${{ startsWith(matrix.config.board, 'bh-galaxy') && 'performance and ci-32' || 'performance and batch-1' }}" ${{ startsWith(matrix.config.board, 'bh-galaxy') && '--data_parallel 32' || '' }} --timeout 1200
      - name: Subtest summary
        if: ${{ always() }}
        run: |
          rc=0
          for m in "$GITHUB_WORKSPACE"/telemetry_output/*/manifest.json; do
            [ -f "$m" ] || continue
            st=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('status',''))" "$m")
            printf '%-26s %s\n' "$(basename "$(dirname "$m")")" "$st"
            [ "$st" = "failed" ] && rc=1
          done
          exit $rc

      - name: Cleanup
        if: ${{ always() }}
        run: |
          # a killed job must not leave the runner's firmware at a short telemetry interval
          if [ "${POWER_CI_TELEM_INTERVAL_MS:-0}" -gt 0 ] 2>/dev/null && [ -x "$VENV_DIR/bin/python3" ]; then
            "$VENV_DIR/bin/python3" "$GITHUB_WORKSPACE/scripts/telem_interval.py" restore >/dev/null 2>&1 || true
          fi
          rm -rf "$GITHUB_WORKSPACE/telemetry_output" "$VENV_DIR" || true
          pkill -f scripts/read_telemetry.py 2>/dev/null || true
          pkill -f scripts/poll_ipmi_power.py 2>/dev/null || true
          [ -f /tmp/network-keepalive.pid ] && kill "$(cat /tmp/network-keepalive.pid)" 2>/dev/null || true
