name: Create a Release

on:
  push:
    tags:
      - 'v*'
      - 'v*rc*'

env:
  RELEASE_NOTES_DIR: doc/release
  SET_VARS_CMDS: |
    VERSION=${GITHUB_REF#refs/tags/}
    echo "VERSION=$VERSION" | tee -a $GITHUB_OUTPUT
    TRIMMED_VERSION=${VERSION/v}
    TRIMMED_VERSION="$(echo "$TRIMMED_VERSION" | sed -e 's/\([0-9]\+\.[0-9]\+\).*/\1/')"
    echo "TRIMMED_VERSION=$TRIMMED_VERSION" | tee -a $GITHUB_OUTPUT
    if [ "$VERSION" = "${VERSION/rc}" ]; then
      # not an rc, so we should generate release notes
      echo "RELEASE_NOTES=release-notes-$TRIMMED_VERSION.md" | tee -a $GITHUB_OUTPUT
    else
      echo "Not publishing release notes for release candidate $VERSION"
    fi

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    outputs:
      boards: ${{ steps.genboards.outputs.boards }}
      recovery_boards: ${{ steps.genboards.outputs.recovery_boards }}
    steps:
      - id: set_vars
        run: ${{ env.SET_VARS_CMDS }}
      - uses: actions/checkout@v4
      - id: genboards
        shell: bash
        run: |
          BOARDS="$(jq -r -c ".[]" .github/boards.json)"
          BOARDS="${BOARDS//$'\n'/ }" # Remove embedded newlines
          echo "boards=$BOARDS" | tee -a $GITHUB_OUTPUT
          echo "recovery_boards=$(jq -c 'map(select(test("^galaxy") | not))' .github/boards.json)" | tee -a $GITHUB_OUTPUT
      - id: check_relnotes_file
        run: |
          relnotes_file="${{ env.RELEASE_NOTES_DIR }}/${{ steps.set_vars.outputs.RELEASE_NOTES }}"
          if [ "${{ steps.set_vars.outputs.RELEASE_NOTES }}" != "" ] && [ ! -f "$relnotes_file" ]; then
            echo "Release notes file is not present: $relnotes_file"
            exit 1
          fi
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v5
        with:
          args: spdx -o tt-system-firmware-${{ steps.set_vars.outputs.VERSION }}.spdx

      - name: Upload SPDX
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: tt-system-firmware-${{ steps.set_vars.outputs.VERSION }}.spdx
          path: tt-system-firmware-${{ steps.set_vars.outputs.VERSION }}.spdx

      - name: Upload Release Notes
        if: ${{ steps.set_vars.outputs.RELEASE_NOTES }}
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ${{ steps.set_vars.outputs.RELEASE_NOTES }}
          path: ${{ env.RELEASE_NOTES_DIR }}/${{ steps.set_vars.outputs.RELEASE_NOTES }}

  build-recovery-bundle:
    runs-on: ubuntu-24.04
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.prepare-release.outputs.recovery_boards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tt-system-firmware
      - uses: ./tt-system-firmware/.github/workflows/prepare-zephyr
        with:
          app-path: tt-system-firmware
      - shell: bash
        run: |
          SIGNATURE_KEY_FILE="$(mktemp)"
          echo "${{ secrets.SIGNATURE_KEY }}" | base64 -d > "$SIGNATURE_KEY_FILE"
          SZ=$(wc -c "$SIGNATURE_KEY_FILE" | awk '{print $1}')
          if [ $SZ -gt 42 ]; then
            echo "SIGNATURE_KEY_FILE=$SIGNATURE_KEY_FILE" >> "$GITHUB_ENV"
          fi
      - name: Build Recovery Bundle
        shell: bash
        run: |
          python3 tt-system-firmware/scripts/tooling/blackhole_recovery/prepare-recovery-bundle.py \
            --board ${{ matrix.board }} \
            --signing-key "$SIGNATURE_KEY_FILE" \
            fw-pack-${{ github.ref_name }}-${{ matrix.board }}-recovery.tar.gz

      - name: Upload Recovery Assets
        uses: actions/upload-artifact@v4
        with:
          name: firmware-recovery-${{ matrix.board }}
          path: |
            fw-pack-${{ github.ref_name }}-${{ matrix.board }}-recovery.tar.gz

  build-release:
    needs: [prepare-release]
    uses: ./.github/workflows/build-fw.yml
    secrets:
      SIGNATURE_KEY: ${{ secrets.SIGNATURE_KEY }}

  build-tooling:
    needs: [prepare-release]
    runs-on: ubuntu-22.04
    name: Build tt-fw-terminal
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build tt-fw-terminal
        run: make -j$(nproc) -C scripts/tooling OUTDIR="$PWD" tt-fw-terminal
      - name: Upload tt-fw-terminal
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: tt-fw-terminal
          path: tt-fw-terminal

  build-debian-pkg:
    needs: [build-release]
    runs-on: ubuntu-24.04
    # Only a v* tag push gets the Debian signing key: the OSPO Vault role
    # binds this environment, and the environment admits only tags v*
    # (OSPO-825).
    environment: deb-signing
    # Under 1 minute today; the Vault step stops after 10.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - id: set_vars
        run: ${{ env.SET_VARS_CMDS }}
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt install -y debsigs dpkg-dev gnupg

      # The Debian signing key comes from the OSPO Vault (OSPO-825). It goes to
      # the import step through `with:` only: not into `run:` text, the job
      # environment, a log or an artifact.
      - name: Get the Debian signing key
        id: vault
        timeout-minutes: 10
        uses: tenstorrent/.github/actions/vault-secrets@8909e7247ace56b203bb0db68cc9dc8fd095c6bc # vault-secrets-v1.1.0
        with:
          role: tenstorrent--tt-system-firmware--deb-signing
          secrets: |
            kv/data/tenstorrent/all.debian_signing_key private | DEB_SIGNING_KEY ;
            kv/data/tenstorrent/all.debian_signing_key public | DEB_SIGNING_PUBLIC_KEY
      - name: Import GPG key
        id: gpg_key_import
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ fromJSON(steps.vault.outputs.secrets).DEB_SIGNING_KEY }}
      # The imported secret key must be the key whose public part is in Vault.
      # Prints fingerprints only.
      - name: Check the imported key against the public key
        shell: bash
        env:
          DEB_SIGNING_PUBLIC_KEY: ${{ fromJSON(steps.vault.outputs.secrets).DEB_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          primary_fprs() { awk -F: '($1 == "pub" || $1 == "sec") { want = 1; next } $1 == "fpr" && want { print $10; want = 0 }'; }
          tmp="$(mktemp -d)"
          trap 'gpgconf --homedir "$tmp" --kill all >/dev/null 2>&1 || true; rm -rf "$tmp"' EXIT
          printf '%s\n' "$DEB_SIGNING_PUBLIC_KEY" | gpg --homedir "$tmp" --batch --quiet --import
          vault_fpr="$(gpg --homedir "$tmp" --batch --with-colons --list-keys | primary_fprs)"
          imported_fpr="$(gpg --batch --with-colons --list-secret-keys | primary_fprs)"
          echo "Imported secret key: ${imported_fpr:-none}"
          echo "Public key from Vault: ${vault_fpr:-none}"
          if [ -z "$vault_fpr" ] || [ "$(printf '%s\n' "$vault_fpr" | wc -l)" -ne 1 ] || [ "$imported_fpr" != "$vault_fpr" ]; then
            echo "::error::The imported signing key does not match the public key from Vault."
            exit 1
          fi
      # The shared Vault action does not leave the tailnet. The build steps
      # below do not need it.
      - name: Leave tailnet
        if: ${{ always() }}
        shell: bash
        run: |
          if command -v tailscale >/dev/null 2>&1; then
            sudo tailscale logout || { echo "::warning::tailscale logout failed; taking the interface down"; sudo tailscale down || true; }
          else
            echo "not on the tailnet"
          fi

      - run: gpg --list-keys
      - run: gpg --list-secret-keys

      - name: Download combined firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: combined-fwbundle
      - name: Show firmware bundles
        run: find * -name '*.fwbundle' -ls

      - name: Build Debian Package
        shell: bash
        run: |
          DEB_VERSION="${{ steps.set_vars.outputs.VERSION }}"
          DEB_VERSION="${DEB_VERSION/v/}"  # Remove leading 'v' if present
          PKG_SIGNING_KEY_DEB="$(for i in $(gpg --list-keys | grep -A 1 '^pub' | head -n2 | tail -n 1); do echo $i; done)"
          ./scripts/build_deb.sh \
            -b fw_pack*.fwbundle \
            -k "$PKG_SIGNING_KEY_DEB" \
            -o . \
            -v "$DEB_VERSION"

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: firmware-debian-pkg
          path: "*.deb"

  publish-release:
    needs: [build-debian-pkg, build-release, prepare-release, build-recovery-bundle, build-tooling]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - id: set_vars
        run: ${{ env.SET_VARS_CMDS }}
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*

      - name: Download combined firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: combined-fwbundle

      - name: Download Release Notes
        if: ${{ steps.set_vars.outputs.RELEASE_NOTES }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.set_vars.outputs.RELEASE_NOTES }}

      - name: Download SPDX
        uses: actions/download-artifact@v4
        with:
          name: tt-system-firmware-${{ steps.set_vars.outputs.VERSION }}.spdx

      - name: Download assembly firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: assembly-fw-*

      - name: Download assembly test artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: assembly-test-*

      - name: Download preflash firmware (p300a)
        uses: actions/download-artifact@v4
        with:
          name: preflash-fw-p300a
          path: preflash-fw/p300a

      - name: Download preflash firmware (p150a)
        uses: actions/download-artifact@v4
        with:
          name: preflash-fw-p150a
          path: preflash-fw/p150a

      - name: Download Debian Package
        uses: actions/download-artifact@v4
        with:
          name: firmware-debian-pkg

      - name: Download tt-fw-terminal
        uses: actions/download-artifact@v4
        with:
          name: tt-fw-terminal

      - name: Package firmware artifacts
        shell: bash
        run: |
          BOARD_REVS=(${{ needs.prepare-release.outputs.boards }})

          for REV in ${BOARD_REVS[@]}; do
            mv firmware-$REV $REV
            mv $REV/update.fwbundle $REV.fwbundle
          done

          # Combine recovery bundles
          mkdir firmware-recovery-${{ github.ref_name }}
          for REV in ${BOARD_REVS[@]}; do
            if [[ "$REV" =~ ^galaxy ]]; then
              continue
            fi
            tar xf firmware-recovery-$REV/fw-pack-${{ github.ref_name }}-$REV-recovery.tar.gz -C firmware-recovery-${{ github.ref_name }}
          done
          tar zcf fw-pack-${{ github.ref_name }}-recovery.tar.gz -C firmware-recovery-${{ github.ref_name }} .

          ASSEMBLY_FW_DIRS=(assembly-fw-*)
          zip -r -9 tt-system-firmware-${{ steps.set_vars.outputs.VERSION }}.zip ${BOARD_REVS[@]} ${ASSEMBLY_FW_DIRS[@]}

          # Package manufacturing artifacts (assembly test collateral + preflash firmware)
          VERSION=${{ steps.set_vars.outputs.VERSION }}
          mkdir manufacturing-artifacts
          cp -r assembly-test-*/. manufacturing-artifacts/
          cp -r preflash-fw/. manufacturing-artifacts/
          tar zcf manufacturing-artifacts-${VERSION}.tar.gz -C manufacturing-artifacts .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Note: body path _may_ be empty for release candidates, even with fail_on_unmatched_files == true
          body_path: ${{ steps.set_vars.outputs.RELEASE_NOTES }}
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            fw-pack-${{ github.ref_name }}-recovery.tar.gz
            *.fwbundle
            *.deb
            tt-system-firmware-${{ steps.set_vars.outputs.VERSION }}.zip
            tt-system-firmware-${{ steps.set_vars.outputs.VERSION }}.spdx
            manufacturing-artifacts-${{ steps.set_vars.outputs.VERSION }}.tar.gz
            tt-fw-terminal
