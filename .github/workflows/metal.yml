name: Metal 🤘

on:
  pull_request:
    types:
      - labeled
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  should-run:
    if: >
      github.event_name == 'schedule'          ||
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'metal-tests' ||
      github.event.label.name == 'metal-stress'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Metal tests will run."

  build-fw-artifact:
    needs: should-run
    uses: ./.github/workflows/build-fw.yml
    secrets:
      SIGNATURE_KEY: ${{ secrets.SIGNATURE_KEY }}

  # Generate a matrix containing the boards with a Metal target
  generate-matrix:
    needs: should-run
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
      stress-matrix: ${{ steps.gen-matrix.outputs.stress-matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen-matrix
        run: |
          echo "matrix=$(jq -c '[.[][] | select(has("metal-image"))]' .github/ci_boards.json)" | tee -a $GITHUB_OUTPUT
          echo "stress-matrix=$(jq -c '[.[][] | select(has("metal-image") and (.board | test("galaxy")))]' .github/ci_boards.json)" | tee -a $GITHUB_OUTPUT

  metal-test:
    name: Metal Test on ${{ matrix.config.board }}
    # metal-stress repeats deploy runs only
    if: github.event_name != 'pull_request' || github.event.label.name == 'metal-tests'
    needs: [build-fw-artifact, generate-matrix]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.config.board }}
    container:
      image: ${{ matrix.config.metal-image }}
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /dev/hugepages:/dev/hugepages
        - /opt/tenstorrent/hf-models/:/opt/tenstorrent/hf-models/
        # Host kernel build tree, required to compile tt-kmd in-container.
        - /lib/modules:/lib/modules:ro
        - /usr/src:/usr/src:ro
      options: ${{ matrix.config.metal-options }}
    env:
      ARCH_NAME: ${{ matrix.config.arch-name }}
      HOME: /home/user/tt-metal
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.HOME }}
    steps:
      - name: Checkout KMD build script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci/build-and-load-kmd.sh
          sparse-checkout-cone-mode: false
          path: tt-system-firmware

      - name: Build and load tt-kmd
        shell: bash
        run: |
          sudo bash "$GITHUB_WORKSPACE/tt-system-firmware/scripts/ci/build-and-load-kmd.sh" \
            "${{ matrix.config.kmd_build }}"

      - name: Install ipmitool
        shell: bash
        run: |
          sudo apt update || true
          sudo apt install -y ipmitool

      - name: Set model env
        shell: bash
        run: |
          MODEL_DIR=/opt/tenstorrent/hf-models/meta-llama/Llama-3.1-8B-Instruct
          test -d "$MODEL_DIR"
          echo "HF_MODEL=$MODEL_DIR" >> "$GITHUB_ENV"
          echo "LLAMA_DIR=$MODEL_DIR" >> "$GITHUB_ENV"

      - id: mkdir-home-user-tt-metal
        run: |
          mkdir -p $HOME
      - name: Download the latest firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-fw-artifact.outputs.combined-fwbundle-artifact }}
          path: ${{ env.HOME }}
      - name: Flash the firmware
        run: |
          python -m venv .env
          source .env/bin/activate
          pip install tt-flash==3.10.0
          tt-flash $HOME/fw_pack-*.fwbundle --force
          tt-smi -r
      - name: Patch Test Command
        run: |
          # Patch whisper demo test to run with CI=false to skip the performance checks.
          # These tests fail on syseng CI because the runners have different configurations
          # than metal CI systems.
          sed -i 's/pytest\(.*\)test_demo_for_conditional_generation/CI=false pytest\1test_demo_for_conditional_generation/g' \
            dockerfile/upstream_test_images/run_upstream_tests_vanilla.sh
          if [ "${{ matrix.config.board }}" == "p300a" ]; then
            # We enable the checks serves as a workaround for SYS-2705, where
            # P300 cards have different outputs on the first run after cold boot.
            SEARCH="echo \"\[upstream-tests\] Running BH upstream didt tests\""
            INSERT="    pytest tests/didt/test_resnet_conv.py::test_resnet_conv -k \"all\" --didt-workload-iterations 100 --determinism-check-interval 0"
            sed -i "/$SEARCH/a$INSERT" dockerfile/upstream_test_images/run_upstream_tests_vanilla.sh
          fi
          if [ "${{ matrix.config.board }}" == "bh-galaxy-revc" ]; then
            # The galaxy has Z port cables, which the deploy ethernet tests require.
            sed -i 's/bh_galaxy_xy_torus\.textproto/bh_galaxy_xy_torus_z_ports.textproto/g' \
              dockerfile/upstream_test_images/run_upstream_tests_vanilla.sh
          fi

          # Patch tests to remove determinism checks, which are only reliable
          # on metal CI fleets
          sed -i 's/--determinism-check-interval 1/--determinism-check-interval 0/g' \
            dockerfile/upstream_test_images/run_upstream_tests_vanilla.sh

          # To verify patch was applied
          cat dockerfile/upstream_test_images/run_upstream_tests_vanilla.sh

      - name: Run Container Test
        timeout-minutes: 120
        run: |
          # Keep the network alive by periodically pulling tenstorrent.com.
          # This prevents a bug in the container runtime where the network interface can
          # drop after a period of inactivity, which would cause our tests to fail.
          echo "while true; do curl --no-progress-meter -o /dev/null https://tenstorrent.com; sleep 10; done" > /tmp/network-keepalive
          chmod +x /tmp/network-keepalive
          /tmp/network-keepalive &
          echo "Network keepalive started."
          dockerfile/upstream_test_images/run_upstream_tests_vanilla.sh ${{ matrix.config.metal-target }} 2>&1 | tee /tmp/container_test_output.log

      - name: Upload Test Output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: metal-test-${{ matrix.config.board }}-output
          path: /tmp/container_test_output.log

      - name: cleanup
        if: ${{ always() }}
        run: |
          # Clean out metal
          rm -f $HOME/fw_pack-*.fwbundle
          kill $(pgrep -f network-keepalive) || true

  metal-deploy-test:
    name: Metal Deploy Test on ${{ matrix.config.board }}
    if: github.event_name != 'pull_request' || github.event.label.name == 'metal-tests'
    needs: [build-fw-artifact, generate-matrix]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.config.board }}
    container:
      image: ${{ matrix.config.metal-image }}
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /dev/hugepages:/dev/hugepages
        # Host kernel build tree, required to compile tt-kmd in-container.
        - /lib/modules:/lib/modules:ro
        - /usr/src:/usr/src:ro
      options: ${{ matrix.config.metal-options }}
    env:
      ARCH_NAME: ${{ matrix.config.arch-name }}
      HOME: /home/user/tt-metal
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.HOME }}
    steps:
      - name: Checkout KMD build script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci/build-and-load-kmd.sh
          sparse-checkout-cone-mode: false
          path: tt-system-firmware

      - name: Build and load tt-kmd
        shell: bash
        run: |
          sudo bash "$GITHUB_WORKSPACE/tt-system-firmware/scripts/ci/build-and-load-kmd.sh" \
            "${{ matrix.config.kmd_build }}"

      - id: mkdir-home-user-tt-metal
        run: |
          mkdir -p $HOME
      - name: Download the latest firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-fw-artifact.outputs.combined-fwbundle-artifact }}
          path: ${{ env.HOME }}
      - name: Flash the firmware
        run: |
          python -m venv .env
          source .env/bin/activate
          pip install tt-flash==3.10.0
          tt-flash $HOME/fw_pack-*.fwbundle --force
          tt-smi -r

      - id: keepalive
        name: Start network keepalive
        run: |
          # Keep the network alive by periodically pulling tenstorrent.com.
          # This prevents a bug in the container runtime where the network interface can
          # drop after a period of inactivity, which would cause our tests to fail.
          echo "while true; do curl --no-progress-meter -o /dev/null https://tenstorrent.com; sleep 10; done" > /tmp/network-keepalive
          chmod +x /tmp/network-keepalive
          /tmp/network-keepalive &
          echo "Network keepalive started."
          mkdir -p /tmp/deploy-logs

      - name: Ethernet tests
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' && matrix.config.metal-deploy-run-eth }}
        timeout-minutes: 120
        run: |
          python tests/tt_metal/tt_metal/deployment/eth/test_runner.py \
            -f /tmp/deploy-logs/eth.log -o /tmp/deploy-logs/eth.json

      - name: DRAM tests
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' }}
        timeout-minutes: 120
        env:
          DRAM_TEST_FAST: 1
        run: |
          python tests/tt_metal/tt_metal/deployment/dram/test_runner.py \
            -l /tmp/deploy-logs/dram.log -o /tmp/deploy-logs/dram.json

      - name: PCIe read test
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          ./build/tools/mem_bench --device-id=0 \
            --benchmark_filter='Device Reading Host/1073741824/32768/1/0/0/iterations:5/manual_time' \
            2>&1 | tee /tmp/deploy-logs/pcie-read.log

      - name: PCIe write test
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          ./build/tools/mem_bench --device-id=0 \
            --benchmark_filter='Device Writing Host/1073741824/32768/0/1/0/iterations:5/manual_time' \
            2>&1 | tee /tmp/deploy-logs/pcie-write.log

      - name: Upload Test Output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: metal-deploy-test-${{ matrix.config.board }}-output
          path: /tmp/deploy-logs

      - name: cleanup
        if: ${{ always() }}
        run: |
          # Clean out metal
          rm -f $HOME/fw_pack-*.fwbundle
          kill $(pgrep -f network-keepalive) || true

  # Label-only, galaxy boards. Repeats the deploy ethernet and GDDR runs
  # 100 times. One ethernet pass is a few minutes, so the full loop is
  # several hours. A hung iteration stops that step.
  metal-stress:
    name: Metal Stress on ${{ matrix.config.board }}
    if: github.event.label.name == 'metal-stress'
    needs: [build-fw-artifact, generate-matrix]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.generate-matrix.outputs.stress-matrix) }}
    runs-on: ${{ matrix.config.board }}
    container:
      image: ${{ matrix.config.metal-image }}
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /dev/hugepages:/dev/hugepages
        # Host kernel build tree, required to compile tt-kmd in-container.
        - /lib/modules:/lib/modules:ro
        - /usr/src:/usr/src:ro
      options: ${{ matrix.config.metal-options }}
    env:
      ARCH_NAME: ${{ matrix.config.arch-name }}
      HOME: /home/user/tt-metal
      STRESS_ITERS: 100
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.HOME }}
    steps:
      - name: Checkout KMD build script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci/build-and-load-kmd.sh
          sparse-checkout-cone-mode: false
          path: tt-system-firmware

      - name: Build and load tt-kmd
        shell: bash
        run: |
          sudo bash "$GITHUB_WORKSPACE/tt-system-firmware/scripts/ci/build-and-load-kmd.sh" \
            "${{ matrix.config.kmd_build }}"

      - id: mkdir-home-user-tt-metal
        run: |
          mkdir -p $HOME
      - name: Download the latest firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-fw-artifact.outputs.combined-fwbundle-artifact }}
          path: ${{ env.HOME }}
      - name: Flash the firmware
        run: |
          python -m venv .env
          source .env/bin/activate
          pip install tt-flash==3.10.0
          tt-flash $HOME/fw_pack-*.fwbundle --force
          tt-smi -r

      - id: keepalive
        name: Start network keepalive
        run: |
          # Keep the network alive by periodically pulling tenstorrent.com.
          # This prevents a bug in the container runtime where the network interface can
          # drop after a period of inactivity, which would cause our tests to fail.
          echo "while true; do curl --no-progress-meter -o /dev/null https://tenstorrent.com; sleep 10; done" > /tmp/network-keepalive
          chmod +x /tmp/network-keepalive
          /tmp/network-keepalive &
          echo "Network keepalive started."
          mkdir -p /tmp/deploy-logs

      - name: Ethernet stress
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' && matrix.config.metal-deploy-run-eth }}
        timeout-minutes: 480
        run: |
          failures=0
          for i in $(seq 1 "$STRESS_ITERS"); do
            printf -v n '%03d' "$i"
            echo "=== Ethernet ${i}/${STRESS_ITERS} ==="
            if timeout 20m python tests/tt_metal/tt_metal/deployment/eth/test_runner.py \
                -q \
                -f "/tmp/deploy-logs/eth-${n}.log" \
                -o "/tmp/deploy-logs/eth-${n}.json"
            then
              echo "Ethernet ${i} passed" | tee -a /tmp/deploy-logs/summary.txt
            else
              rc=$?
              echo "Ethernet ${i} failed (exit ${rc})" | tee -a /tmp/deploy-logs/summary.txt
              if [ "$rc" -eq 124 ]; then
                echo "Ethernet ${i} timed out; stopping"
                exit 124
              fi
              failures=$((failures + 1))
            fi
          done
          echo "Ethernet failures: ${failures}/${STRESS_ITERS}" | tee -a /tmp/deploy-logs/summary.txt
          [ "$failures" -eq 0 ]

      - name: GDDR stress
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' }}
        timeout-minutes: 360
        env:
          DRAM_TEST_FAST: 1
        run: |
          # The deploy DRAM runner exercises GDDR on Blackhole. DRAM_TEST_FAST
          # matches metal-deploy-test, so each iteration is the same check.
          failures=0
          for i in $(seq 1 "$STRESS_ITERS"); do
            printf -v n '%03d' "$i"
            echo "=== GDDR ${i}/${STRESS_ITERS} ==="
            if timeout 10m python tests/tt_metal/tt_metal/deployment/dram/test_runner.py \
                -q \
                -l "/tmp/deploy-logs/dram-${n}.log" \
                -o "/tmp/deploy-logs/dram-${n}.json"
            then
              echo "GDDR ${i} passed" | tee -a /tmp/deploy-logs/summary.txt
            else
              rc=$?
              echo "GDDR ${i} failed (exit ${rc})" | tee -a /tmp/deploy-logs/summary.txt
              if [ "$rc" -eq 124 ]; then
                echo "GDDR ${i} timed out; stopping"
                exit 124
              fi
              failures=$((failures + 1))
            fi
          done
          echo "GDDR failures: ${failures}/${STRESS_ITERS}" | tee -a /tmp/deploy-logs/summary.txt
          [ "$failures" -eq 0 ]

      - name: Upload Test Output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: metal-stress-${{ matrix.config.board }}-output
          path: /tmp/deploy-logs

      - name: cleanup
        if: ${{ always() }}
        run: |
          # Clean out metal
          rm -f $HOME/fw_pack-*.fwbundle
          kill $(pgrep -f network-keepalive) || true
