name: Build bh-mod (Composite)
description: |
  Build bh-mod from luwen and install it to /usr/local/bin for the ccfgovr
  tests. Should be run within the base tt-system-firmware container.

inputs:
  luwen-repo:
    description: 'luwen repository to build bh-mod from'
    required: true
  luwen-ref:
    description: 'Branch or tag of luwen-repo to build'
    required: true

runs:
  using: composite
  steps:
    - name: Build bh-mod
      shell: bash
      env:
        LUWEN_REPO: ${{ inputs.luwen-repo }}
        LUWEN_REF: ${{ inputs.luwen-ref }}
      run: |
        set -euo pipefail
        missing=()
        command -v protoc >/dev/null 2>&1 || missing+=(protobuf-compiler)
        command -v curl   >/dev/null 2>&1 || missing+=(curl ca-certificates)
        if [ ${#missing[@]} -gt 0 ]; then
          apt-get update && apt-get install -y --no-install-recommends "${missing[@]}"
        fi
        protoc --version
        # Ensure a Rust toolchain is available
        if ! command -v cargo >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
        fi
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo --version
        rm -rf "$HOME/luwen"
        git clone --depth 1 --branch "$LUWEN_REF" "$LUWEN_REPO" "$HOME/luwen"
        cargo build --release -p bh-mod --manifest-path "$HOME/luwen/Cargo.toml"
        install -m 0755 "$HOME/luwen/target/release/bh-mod" /usr/local/bin/bh-mod
        bh-mod --help
