name: Release Validation

# TODO: ungate this once every change is locked in
# on:
#   release:
#     types:
#       - published
#   workflow_dispatch: {}
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  build-fw-artifact:
    uses: ./.github/workflows/build-fw.yml
    secrets:
      SIGNATURE_KEY: ${{ secrets.SIGNATURE_KEY }}

  # Boards that define a "num-devices" count in ci_boards.json
  generate-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen-matrix
        run: |
          echo "matrix=$(jq -c '[.[][] | select(has("metal-image") and has("num-devices"))]' .github/ci_boards.json)" | tee -a $GITHUB_OUTPUT

  metal-ip-tests:
    name: Metal IP tests (PCIe BW + DRAM BW ) on ${{ matrix.config.board }}
    needs: [build-fw-artifact, generate-matrix]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.config.board }}
    container:
      image: ${{ matrix.config.metal-image }}
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /dev/hugepages:/dev/hugepages
        # Host kernel build tree, required to compile tt-kmd in-container.
        - /lib/modules:/lib/modules:ro
        - /usr/src:/usr/src:ro
      options: ${{ matrix.config.metal-options }}
    env:
      ARCH_NAME: ${{ matrix.config.arch-name }}
      HOME: /home/user/tt-metal
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.HOME }}
    steps:
      - name: Checkout KMD build script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci/build-and-load-kmd.sh
            scripts/ci/run-metal-test-multi-device.sh
          sparse-checkout-cone-mode: false
          path: tt-system-firmware

      - name: Build and load tt-kmd
        run: |
          sudo bash "$GITHUB_WORKSPACE/tt-system-firmware/scripts/ci/build-and-load-kmd.sh" \
            "${{ matrix.config.kmd_build }}"

      - name: Download the firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-fw-artifact.outputs.combined-fwbundle-artifact }}
          path: ${{ env.HOME }}

      - name: Flash the firmware
        run: |
          python -m venv .env
          source .env/bin/activate
          pip install tt-flash==3.10.0
          tt-flash $HOME/fw_pack-*.fwbundle --force
          tt-smi -r

      - id: keepalive
        name: Start network keepalive
        run: |
          # Keep the network alive by periodically pulling tenstorrent.com.
          # This prevents a bug in the container runtime where the network interface can
          # drop after a period of inactivity, which would cause our tests to fail.
          echo "while true; do curl --no-progress-meter -o /dev/null https://tenstorrent.com; sleep 10; done" > /tmp/network-keepalive
          chmod +x /tmp/network-keepalive
          /tmp/network-keepalive &
          echo "Network keepalive started."
          mkdir -p /tmp/deploy-logs

      - name: PCIe read test
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' }}
        timeout-minutes: 60
        env:
          NUM_DEVICES: ${{ matrix.config.num-devices }}
          LOG_DIR: /tmp/deploy-logs/pcie-read
        run: |
          bash "$GITHUB_WORKSPACE/tt-system-firmware/scripts/ci/run-metal-test-multi-device.sh" \
            ./build/tools/mem_bench --num-devices "$NUM_DEVICES" -- \
            --device-id=0 \
            --benchmark_filter='Device Reading Host/1073741824/32768/1/0/0/iterations:5/manual_time'

      - name: PCIe write test
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' }}
        timeout-minutes: 60
        env:
          NUM_DEVICES: ${{ matrix.config.num-devices }}
          LOG_DIR: /tmp/deploy-logs/pcie-write
        run: |
          bash "$GITHUB_WORKSPACE/tt-system-firmware/scripts/ci/run-metal-test-multi-device.sh" \
            ./build/tools/mem_bench --num-devices "$NUM_DEVICES" -- \
            --device-id=0 \
            --benchmark_filter='Device Writing Host/1073741824/32768/0/1/0/iterations:5/manual_time'

      - name: Build metal tests
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' }}
        timeout-minutes: 10
        run: ./build_metal.sh --build-metal-tests

      - name: DRAM BW test
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' }}
        timeout-minutes: 5
        env:
          NUM_DEVICES: ${{ matrix.config.num-devices }}
        run: |
          bash "$GITHUB_WORKSPACE/tt-system-firmware/scripts/ci/run-metal-test-multi-device.sh" \
            ./build/test/tt_metal/unit_tests_api \
            --test-filter '*DramKernelDRISCBWFixture*:*DramKernelDRISCGDDRBWSweepFixture*' \
            --num-devices "$NUM_DEVICES"

      - name: Upload Test Output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ matrix.config.board }}-output
          path: /tmp/deploy-logs

      - name: Upload DRAM BW Output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dram-bw-${{ matrix.config.board }}-output
          path: ${{ env.HOME }}/logs

      - name: cleanup
        if: ${{ always() }}
        run: |
          rm -f $HOME/fw_pack-*.fwbundle
          kill $(pgrep -f network-keepalive) || true

  check-pci-width-gen:
    name: PCIe width/gen on ${{ matrix.config.board }}
    needs: [build-fw-artifact, generate-matrix]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.config.board }}
    container:
      image: ${{ matrix.config.metal-image }}
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /dev/hugepages:/dev/hugepages
        # Host kernel build tree, required to compile tt-kmd in-container.
        - /lib/modules:/lib/modules:ro
        - /usr/src:/usr/src:ro
      options: ${{ matrix.config.metal-options }}
    env:
      ARCH_NAME: ${{ matrix.config.arch-name }}
      HOME: /home/user/tt-metal
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.HOME }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci/build-and-load-kmd.sh
            scripts/ci/check-lspci.sh
          sparse-checkout-cone-mode: false
          path: tt-system-firmware

      - name: Build and load tt-kmd
        run: |
          sudo bash "$GITHUB_WORKSPACE/tt-system-firmware/scripts/ci/build-and-load-kmd.sh" \
            "${{ matrix.config.kmd_build }}"

      - name: Install pciutils
        run: |
          sudo apt update || true
          sudo apt install -y pciutils

      - name: Download the firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-fw-artifact.outputs.combined-fwbundle-artifact }}
          path: ${{ env.HOME }}

      - name: Flash the firmware
        run: |
          python -m venv .env
          source .env/bin/activate
          pip install tt-flash==3.10.0
          tt-flash $HOME/fw_pack-*.fwbundle --force
          tt-smi -r

      - name: Check PCIe link width and gen
        run: |
          CHECK="$GITHUB_WORKSPACE/tt-system-firmware/scripts/ci/check-lspci.sh"
          mkdir -p /tmp/deploy-logs

          # Per-platform expectations: check-lspci.sh <gen> <BDF> [width]
          check_device() {
            local bdf=$1
            case "${{ matrix.config.board }}" in
              bh-galaxy-revc)
                # Devices behind bus 0000:06 are x8, all others x1.
                if readlink -f "/sys/bus/pci/devices/$bdf" | grep -q "/0000:06:"; then
                  "$CHECK" 5 "$bdf" 8
                else
                  "$CHECK" 5 "$bdf" 1
                fi
                ;;
              quietbox2)
                # Expect x4, retry once expecting x8.
                "$CHECK" 4 "$bdf" 4 || "$CHECK" 4 "$bdf" 8
                ;;
              loudbox)
                # No width arg (defaults to x16).
                "$CHECK" 5 "$bdf"
                ;;
              *)
                echo "No PCIe expectations defined for ${{ matrix.config.board }}, skipping"
                ;;
            esac
          }

          mapfile -t bdfs < <(lspci -D -d 1e52: | awk '{print $1}')
          if [ "${#bdfs[@]}" -eq 0 ]; then
            echo "No Tenstorrent devices found by lspci"
            exit 1
          fi

          # Keep going after a failure so every device gets checked, then fail at the end.
          rc=0
          for bdf in "${bdfs[@]}"; do
            echo "::group::$bdf"
            check_device "$bdf" 2>&1 | tee "/tmp/deploy-logs/pci-width-${bdf//:/_}.log" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Upload Test Output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-pci-width-${{ matrix.config.board }}-output
          path: /tmp/deploy-logs

      - name: cleanup
        if: ${{ always() }}
        run: |
          rm -f $HOME/fw_pack-*.fwbundle
