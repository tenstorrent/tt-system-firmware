name: Release Validation

# This workflow flashes and stress-tests the shared CI boards for about an
# hour per iteration. It must not run on pull_request: every push to a PR
# would enqueue <iterations> jobs (each of which flashes the board) on the
# same runners used by metal.yml, the E2E stress tests and tt-sw-manifest.
# Use workflow_dispatch to exercise it while developing.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  release:
    types:
      - published
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Number of times to run the full test list on each board"
        type: number
        default: 5

concurrency:
  # One run of this workflow at a time: the matrix jobs all share the same
  # physical boards, and a second run must not flash while tests are running.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-fw-artifact:
    uses: ./.github/workflows/build-fw.yml
    secrets:
      SIGNATURE_KEY: ${{ secrets.SIGNATURE_KEY }}

  # Boards that define a "num-devices" count in ci_boards.json
  generate-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
      iterations: ${{ steps.gen-matrix.outputs.iterations }}
    steps:
      - uses: actions/checkout@v4
      - id: gen-matrix
        run: |
          echo "matrix=$(jq -c '[.[][] | select(has("metal-image") and has("num-devices"))]' .github/ci_boards.json)" | tee -a $GITHUB_OUTPUT
          echo "iterations=$(jq -nc --argjson n ${{ inputs.iterations || 5 }} '[range(1; $n + 1)]')" | tee -a $GITHUB_OUTPUT

  # Flash every board once per run. Flashing is kept out of the per-iteration
  # job on purpose: a chip must be reset (so that nothing is left running on
  # it from a previous job) before tt-flash talks to it, and a chip that failed
  # flash verification must not be flashed again or reset until someone has
  # looked at it.
  flash-firmware:
    name: Flash ${{ matrix.config.board }}
    needs: [build-fw-artifact, generate-matrix]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.config.board }}
    container:
      image: ${{ matrix.config.metal-image }}
      volumes:
        - /lib/modules:/lib/modules:ro
        - /usr/src:/usr/src:ro
      options: ${{ matrix.config.metal-options }}
    env:
      HOME: /home/user/tt-metal
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.HOME }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci/build-and-load-kmd.sh
          sparse-checkout-cone-mode: false
          path: tt-system-firmware

      - name: Build and load tt-kmd
        run: |
          sudo bash "$GITHUB_WORKSPACE/tt-system-firmware/scripts/ci/build-and-load-kmd.sh" \
            "${{ matrix.config.kmd_build }}"

      - name: Download the firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-fw-artifact.outputs.combined-fwbundle-artifact }}
          path: ${{ env.HOME }}

      - name: Install tt-flash
        run: |
          python -m venv .env
          source .env/bin/activate
          pip install tt-flash==3.10.0

      - name: Reset devices before flashing
        run: |
          # Whatever ran on this board before us may have been killed by a
          # step timeout, leaving kernels running on tensix/eth cores. The SPI
          # programming path goes host -> PCIe -> NOC -> ARC CSM buffer ->
          # TT_SMC_MSG_WRITE_EEPROM, so never flash a chip that is not idle.
          # If the reset fails, the board is not healthy: stop here rather
          # than flash it.
          source .env/bin/activate
          tt-smi -r

      - name: Flash the firmware
        run: |
          source .env/bin/activate
          # If tt-flash fails (e.g. post-flash verification mismatch), this
          # step fails before the reset below and the chip keeps running the
          # firmware it already has. Resetting after a failed flash boots the
          # corrupted image and bricks the chip.
          tt-flash $HOME/fw_pack-*.fwbundle --force
          tt-smi -r

      - name: cleanup
        if: ${{ always() }}
        run: |
          rm -f $HOME/fw_pack-*.fwbundle

  release-validation:
    name: Release validation iter ${{ matrix.iteration }} on ${{ matrix.config.board }}
    needs: [generate-matrix, flash-firmware]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
        iteration: ${{ fromJson(needs.generate-matrix.outputs.iterations) }}
    runs-on: ${{ matrix.config.board }}
    container:
      image: ${{ matrix.config.metal-image }}
      volumes:
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /dev/hugepages:/dev/hugepages
        # Host kernel build tree, required to compile tt-kmd in-container.
        - /lib/modules:/lib/modules:ro
        - /usr/src:/usr/src:ro
      options: ${{ matrix.config.metal-options }}
    env:
      ARCH_NAME: ${{ matrix.config.arch-name }}
      HOME: /home/user/tt-metal
      NUM_DEVICES: ${{ matrix.config.num-devices }}
      ETH_TEST_EXPECTED_LINKS: ${{ matrix.config.eth-test-expected-links || '0' }}
      # Times each ethernet test is repeated
      ETH_TEST_RUNS: 10
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.HOME }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci/build-and-load-kmd.sh
            scripts/ci/run-metal-test-multi-device.sh
            scripts/ci/check-lspci.sh
          sparse-checkout-cone-mode: false
          path: tt-system-firmware

      - name: Build and load tt-kmd
        run: |
          sudo bash "$GITHUB_WORKSPACE/tt-system-firmware/scripts/ci/build-and-load-kmd.sh" \
            "${{ matrix.config.kmd_build }}"

      - name: Install pciutils
        run: |
          sudo apt update || true
          sudo apt install -y pciutils

      - name: Set up tools venv
        run: |
          python -m venv .env
          source .env/bin/activate
          pip install tt-flash==3.10.0

      - name: Reset devices
        run: |
          # Start every iteration from a clean chip state, regardless of what
          # the previous job on this runner left behind.
          source .env/bin/activate
          tt-smi -r

      - id: keepalive
        name: Start network keepalive
        run: |
          # Keep the network alive by periodically pulling tenstorrent.com.
          # This prevents a bug in the container runtime where the network interface can
          # drop after a period of inactivity, which would cause our tests to fail.
          echo "while true; do curl --no-progress-meter -o /dev/null https://tenstorrent.com; sleep 10; done" > /tmp/network-keepalive
          chmod +x /tmp/network-keepalive
          /tmp/network-keepalive &
          echo "Network keepalive started."
          mkdir -p /tmp/deploy-logs

      - name: Check PCIe link width and gen
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' }}
        env:
          LOG_DIR: /tmp/deploy-logs/pci-width
        run: |
          bash "$GITHUB_WORKSPACE/tt-system-firmware/scripts/ci/check-lspci.sh" \
            --board "${{ matrix.config.board }}"

      - name: PCIe write test
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' }}
        timeout-minutes: 10
        env:
          LOG_DIR: /tmp/deploy-logs/pcie-write
        run: |
          bash "$GITHUB_WORKSPACE/tt-system-firmware/scripts/ci/run-metal-test-multi-device.sh" \
            ${{ matrix.config.separate-cache && '--separate-cache' || '' }} \
            ${{ matrix.config.single-visible-device && '--single-visible-device' || '' }} \
            ./build/tools/mem_bench --num-devices "$NUM_DEVICES" -- \
            --benchmark_repetitions=20 \
            --benchmark_filter='Device Writing Host/1073741824/32768/0/1/0/iterations:5/manual_time'

      - name: PCIe read test
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' }}
        timeout-minutes: 10
        env:
          LOG_DIR: /tmp/deploy-logs/pcie-read
        run: |
          bash "$GITHUB_WORKSPACE/tt-system-firmware/scripts/ci/run-metal-test-multi-device.sh" \
            ${{ matrix.config.separate-cache && '--separate-cache' || '' }} \
            ${{ matrix.config.single-visible-device && '--single-visible-device' || '' }} \
            ./build/tools/mem_bench --num-devices "$NUM_DEVICES" -- \
            --benchmark_repetitions=20 \
            --benchmark_filter='Device Reading Host/1073741824/32768/1/0/0/iterations:5/manual_time'

      - name: DRAM unary BW test
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' }}
        # 100 repeats take well over 30 minutes; a step timeout kills the host
        # process but leaves the dispatch kernels running on the device, which
        # is what the final "Reset devices" step is for. Size from measurements.
        timeout-minutes: 90
        env:
          LOG_DIR: /tmp/deploy-logs/unary-dram
        run: |
          # --count is provided by pytest-repeat
          # The unary test does not support slow dispatch mode
          rc=0
          bash "$GITHUB_WORKSPACE/tt-system-firmware/scripts/ci/run-metal-test-multi-device.sh" \
            --fast-dispatch --hide-build-logs \
            python --num-devices 1 -- \
            -m pytest -s tests/tt_metal/tt_metal/data_movement/python/test_data_movement.py \
            --confcutdir=tests/tt_metal/tt_metal/data_movement/python \
            --arch=blackhole --verbose-log --report \
            --gtest-filter='DRAMPacketSizes:*DRAMCoreLocations:*DRAMChannels:*DRAMDirectedIdeal' \
            --count=100 || rc=$?
          # The test ignores the exit status of the gtest binary, so a skipped
          # suite only shows up later as a missing profiler log.
          # therefore we need this grep to detect a skip and mark as failed.
          if grep -qE 'SKIPPED|Fast Dispatch Mode' "$LOG_DIR/dev0.log"; then
            echo "::error::gtest skipped tests in the data movement run"
            grep -E 'SKIPPED|Fast Dispatch Mode' "$LOG_DIR/dev0.log" | sort | uniq -c
            rc=1
          fi
          exit $rc

      - name: DRAM deploy test
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' }}
        timeout-minutes: 10
        env:
          # DRAM_TEST_FAST is left unset so that all memory patterns are used
          DRAM_TEST_LOOPS: 20
        run: |
          python tests/tt_metal/tt_metal/deployment/dram/test_runner.py \
            -l /tmp/deploy-logs/dram.log -o /tmp/deploy-logs/dram.json

      - name: Ethernet bidir BW test 64B
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' && matrix.config.metal-deploy-run-eth }}
        # ETH_TEST_RUNS runs over all links on a 32-chip galaxy do not fit in
        # 5 minutes. See the note on the DRAM unary BW test.
        timeout-minutes: 45
        env:
          ETH_TEST_TRANSFER_SIZE: 64
          TT_METAL_SLOW_DISPATCH_MODE: 1
        run: |
          rc=0
          for run in $(seq 1 "$ETH_TEST_RUNS"); do
            python tests/tt_metal/tt_metal/deployment/eth/test_runner.py \
              -t BandwidthBidir \
              -f /tmp/deploy-logs/eth-bw-64B-$run.log \
              -o /tmp/deploy-logs/eth-bw-64B-$run.json || rc=1
          done
          exit $rc

      - name: Ethernet bidir BW test 1024B
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' && matrix.config.metal-deploy-run-eth }}
        timeout-minutes: 45
        env:
          ETH_TEST_TRANSFER_SIZE: 1024
          TT_METAL_SLOW_DISPATCH_MODE: 1
        run: |
          rc=0
          for run in $(seq 1 "$ETH_TEST_RUNS"); do
            python tests/tt_metal/tt_metal/deployment/eth/test_runner.py \
              -t BandwidthBidir \
              -f /tmp/deploy-logs/eth-bw-1024B-$run.log \
              -o /tmp/deploy-logs/eth-bw-1024B-$run.json || rc=1
          done
          exit $rc

      - name: Ethernet bidir BW test 4096B
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' && matrix.config.metal-deploy-run-eth }}
        timeout-minutes: 45
        env:
          ETH_TEST_TRANSFER_SIZE: 4096
          TT_METAL_SLOW_DISPATCH_MODE: 1
        run: |
          rc=0
          for run in $(seq 1 "$ETH_TEST_RUNS"); do
            python tests/tt_metal/tt_metal/deployment/eth/test_runner.py \
              -t BandwidthBidir \
              -f /tmp/deploy-logs/eth-bw-4096B-$run.log \
              -o /tmp/deploy-logs/eth-bw-4096B-$run.json || rc=1
          done
          exit $rc

      - name: Ethernet DRAM data integrity bidir test 64B
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' && matrix.config.metal-deploy-run-eth }}
        timeout-minutes: 45
        env:
          ETH_TEST_TRANSFER_SIZE: 64
          TT_METAL_SLOW_DISPATCH_MODE: 1
        run: |
          rc=0
          for run in $(seq 1 "$ETH_TEST_RUNS"); do
            python tests/tt_metal/tt_metal/deployment/eth/test_runner.py \
              -t DataIntegrityDramBidir \
              -f /tmp/deploy-logs/eth-di-dram-64B-$run.log \
              -o /tmp/deploy-logs/eth-di-dram-64B-$run.json || rc=1
          done
          exit $rc

      - name: Ethernet DRAM data integrity bidir test 1024B
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' && matrix.config.metal-deploy-run-eth }}
        timeout-minutes: 45
        env:
          ETH_TEST_TRANSFER_SIZE: 1024
          TT_METAL_SLOW_DISPATCH_MODE: 1
        run: |
          rc=0
          for run in $(seq 1 "$ETH_TEST_RUNS"); do
            python tests/tt_metal/tt_metal/deployment/eth/test_runner.py \
              -t DataIntegrityDramBidir \
              -f /tmp/deploy-logs/eth-di-dram-1024B-$run.log \
              -o /tmp/deploy-logs/eth-di-dram-1024B-$run.json || rc=1
          done
          exit $rc

      - name: Ethernet DRAM data integrity bidir test 4096B
        if: ${{ !cancelled() && steps.keepalive.outcome == 'success' && matrix.config.metal-deploy-run-eth }}
        timeout-minutes: 45
        env:
          ETH_TEST_TRANSFER_SIZE: 4096
          TT_METAL_SLOW_DISPATCH_MODE: 1
        run: |
          rc=0
          for run in $(seq 1 "$ETH_TEST_RUNS"); do
            python tests/tt_metal/tt_metal/deployment/eth/test_runner.py \
              -t DataIntegrityDramBidir \
              -f /tmp/deploy-logs/eth-di-dram-4096B-$run.log \
              -o /tmp/deploy-logs/eth-di-dram-4096B-$run.json || rc=1
          done
          exit $rc

      - name: Upload Test Output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ matrix.config.board }}-iter${{ matrix.iteration }}-output
          path: /tmp/deploy-logs

      - name: Upload DRAM BW Output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dram-bw-${{ matrix.config.board }}-iter${{ matrix.iteration }}-output
          path: ${{ env.HOME }}/logs

      - name: cleanup
        if: ${{ always() }}
        run: |
          kill $(pgrep -f network-keepalive) || true

      - name: Reset devices
        if: ${{ always() }}
        run: |
          # A step timeout only kills the host side (and, in a container job,
          # not always even that): kernels keep running on the tensix and eth
          # cores until the chip is reset. Never hand the board to the next job
          # in that state: the next thing that job does may be tt-flash.
          # Kill anything still holding /dev/tenstorrent, then reset. If the
          # reset fails the job fails, so a sick board is noticed here instead
          # of in whatever runs next.
          pkill -TERM -f 'mem_bench|test_runner.py|pytest' || true
          sleep 5
          pkill -KILL -f 'mem_bench|test_runner.py|pytest' || true
          source .env/bin/activate || true
          tt-smi -r
