name: HW Nucleo

on:
  push:
    branches:
      - v*-branch
      - collab*
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
    branches:
      - main
      - v*-branch
      - collab*
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  nucleo-mctp-test:
    name: MCTP I3C Loopback Test on nucleo_u385rg_q
    # Runner must have a nucleo_u385rg_q attached over its onboard ST-Link, wired for the
    # i3c_loopback fixture (PB2 <-> PB10, PC1 <-> PB14). The probe serial number can be
    # overridden with the NUCLEO_PROBE_ID repository variable, which is not available to
    # pull requests from forks.
    runs-on: nucleo_u385rg_q
    timeout-minutes: 30
    container:
      image: ghcr.io/tenstorrent/tt-system-firmware/ci-image:v19.11.0
      volumes:
        # udev creates the by-id serial links on the host only
        - /dev/serial/by-id:/dev/serial/by-id:ro
      options: '--device /dev/bus/usb --privileged'
    steps:
      - name: Cleanup State
        if: ${{ always() }}
        run: |
          # Print state of current directory
          ls -la
          # Clean up any files left over from previous steps
          rm -rf *

      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          path: tt-system-firmware

      - name: Prepare Container
        uses: ./tt-system-firmware/.github/workflows/prepare-container
        with:
          app-path: tt-system-firmware

      - name: run-nucleo-tests
        run: |
          tt-system-firmware/scripts/ci/run-nucleo.sh -i ${{ vars.NUCLEO_PROBE_ID || '003900423234510337333934' }}

      - name: Upload Nucleo Test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Nucleo test results (nucleo_u385rg_q)
          include-hidden-files: true
          path: |
            zephyr/twister-nucleo/**/handler.log
            zephyr/twister-nucleo/**/build.log
            zephyr/twister-nucleo/**/zephyr.dts
            zephyr/twister-nucleo/**/.config
            zephyr/twister-nucleo/**/*.map
            zephyr/twister-nucleo/**/zephyr.elf
            zephyr/twister-nucleo/**/device.log
            zephyr/twister-nucleo/twister.log
            zephyr/twister-nucleo/twister.json
