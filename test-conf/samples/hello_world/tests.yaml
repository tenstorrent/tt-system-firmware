sample:
  description: Hello World sample, the simplest Zephyr
    application
  name: hello world
common:
  tags:
    - introduction
    - smoke
  integration_platforms:
    - native_sim
  harness: console
  harness_config:
    type: one_line
    regex:
      - "Hello World! (.*)"
tests:
  sample.basic.helloworld.rtt:
    filter: CONFIG_USE_SEGGER_RTT
    platform_exclude:
      - tt_mmk/tt_keraunos/smc
      - tt_mmk/tt_mimir/smc
      - tt_qsr1a1/tt_quasar/smc
      - tt_qsr1a1/tt_keraunos/smc
      - tt_qsr1a1/tt_mimir/smc
    tags:
      - rtt
  sample.basic.helloworld.grendel:
    platform_allow:
      - tt_mimir/tt_mimir/smc
      - tt_mmk/tt_keraunos/sep
      - tt_mmk/tt_keraunos/smc
      - tt_mmk/tt_mimir/smc
      - tt_qsr1a1/tt_keraunos/smc
      - tt_qsr1a1/tt_mimir/smc
      - tt_qsr1a1/tt_quasar/smc
