# Stand-in for SMC BL1 in the SEP BL1 handoff test. It only has to prove that
# BL0P5 copied it to load_addr and mret'd to entry_point, so everything the
# real BL1 would bring up is off.
CONFIG_I3C=n
CONFIG_SENSOR=n
CONFIG_FLASH=n
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_PICOLIBC_IO_LONG_LONG=n

CONFIG_ISR_STACK_SIZE=512
CONFIG_IDLE_STACK_SIZE=256
CONFIG_MP_MAX_NUM_CPUS=1
