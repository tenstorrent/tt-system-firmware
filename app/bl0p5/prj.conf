CONFIG_I3C=n

# BL0P5 jumps to BL1 in main() and never returns; the PVT sensor
# driver and MCUboot flash-confirm logic are unused in this variant.
CONFIG_SENSOR=n
CONFIG_FLASH=n

# No float/double formatting needed in this variant's printk/printf usage
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_PICOLIBC_IO_LONG_LONG=n

# BUN2 loader jumps to BL1 and never returns; no interrupts are serviced and the idle
# thread is never scheduled, so their stacks can be shrunk to the bare minimum.
CONFIG_ISR_STACK_SIZE=512
CONFIG_IDLE_STACK_SIZE=256

# BL1 runs on a single CPU; eliminates 3 extra ISR stacks and idle stacks (~7.7 KB)
CONFIG_MP_MAX_NUM_CPUS=1

# Deferred logging is flushed by a thread that never gets to run before the jump to BL1,
# so messages are emitted synchronously instead.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Disable PMP to save padding space...
CONFIG_RISCV_PMP=n

# Tag logs with BL0.5
CONFIG_LOG_TAG_MAX_LEN=5
CONFIG_LOG_TAG_DEFAULT="BL0.5"

CONFIG_TT_GRENDEL_PCIE=y
CONFIG_TT_GRENDEL_PCIE_HW_INIT=n
