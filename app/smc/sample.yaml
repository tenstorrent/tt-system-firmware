sample:
  description: Tenstorrent Blackhole Chip Management Firmware
  name: bh-cmfw
common:
  timeout: 180
  platform_allow:
    - tt_blackhole@p100a/tt_blackhole/smc
    - tt_blackhole@p150a/tt_blackhole/smc
    - tt_blackhole@p300a/tt_blackhole/smc
tests:
  app.default: {}
  app.e2e-smoke-flash:
    tags: e2e-flash
    timeout: 720 # 12 minutes
    harness: pytest
    sysbuild: true
    harness_config:
      pytest_root:
        - pytest/e2e_smoke.py
      pytest_args:
        - "--dut-scope=session"
    extra_args:
      - dmc_CONFIG_DMC_RUN_SMBUS_TESTS=y
  app.recovery:
    build_only: true
    extra_overlay_confs:
      - sysbuild/recovery.conf
  app.recovery-flash:
    # Each parametrized corruption case does a bad flash + a good reflash,
    # test_rom_and_failover_preserved_on_update adds three more, and
    # test_released_tt_flash_still_flashes a pip install of the previous
    # tt-flash release and one flash on top of that. On a single-ASIC card a
    # flash is around a minute, so the sweep fits comfortably inside 15
    # minutes. tt-flash has no way to address one chip, so on a galaxy every
    # one of those flashes writes every PCIe-local ASIC on the tray and the
    # budget has to cover the whole set.
    timeout: 3600 # 1 hour
    sysbuild: true
    tags: recovery
    # Wider than the p100a/p150a/p300a default above. Recovery is exercised on
    # the galaxy too, which has no DMC and no SWD adapter; nothing here needs
    # either, as the reset the payload corruption relies on goes through the
    # KMD's reset ioctl. p300c covers the quietbox2, which is a pair of them and
    # builds as an ordinary p300.
    platform_allow:
      - tt_blackhole@p100a/tt_blackhole/smc
      - tt_blackhole@p150a/tt_blackhole/smc
      - tt_blackhole@p300a/tt_blackhole/smc
      - tt_blackhole@p300c/tt_blackhole/smc
      - tt_blackhole@galaxy/tt_blackhole/smc
      - tt_blackhole@galaxy_revc/tt_blackhole/smc
    harness: pytest
    harness_config:
      pytest_root:
        - pytest/recovery.py
      pytest_args:
        - "--dut-scope=session"
  app.vuart-bh-1x:
    tags: e2e
    depends_on: bh_1x
    harness: pytest
    harness_config:
      pytest_root:
        - pytest/vuart.py
      pytest_args:
        - "--dut-scope=session"
  app.vuart-bh-2x:
    tags: e2e
    depends_on: bh_2x
    harness: pytest
    harness_config:
      pytest_root:
        - pytest/vuart.py
      pytest_args:
        - "--dut-scope=session"
        - "--asic-id=1"
  app.stress-test:
    # Budget 3 hours for stress testing. Any more and we should consider reducing test coverage
    # nightly, as CI machines might not be available for PR efforts
    timeout: 10800
    tags: e2e-stress
    platform_allow:
      - tt_blackhole@p100a/tt_blackhole/smc
      - tt_blackhole@p150a/tt_blackhole/smc
      - tt_blackhole@p150b/tt_blackhole/smc
      - tt_blackhole@p300a/tt_blackhole/smc
      - tt_blackhole@p300c/tt_blackhole/smc
      - tt_blackhole@galaxy/tt_blackhole/smc
      - tt_blackhole@galaxy_revc/tt_blackhole/smc
    harness: pytest
    sysbuild: true
    extra_args:
      - dmc_CONFIG_DMC_RUN_SMBUS_TESTS=y
    harness_config:
      pytest_root:
        - pytest/e2e_stress.py
      pytest_args:
        - "--dut-scope=session"
      record:
        regex:
          - >-
            INFO: (?P<test_name>.*) completed.
            Failed (?P<fail_count>\d+)/(?P<total_tries>\d+) times.
  # Runs production firmware tests when compiled with CONFIG_ASSERT=y
  app.e2e-prod-assert:
    tags: e2e-stress
    timeout: 720 # 12 minutes
    harness: pytest
    sysbuild: true
    harness_config:
      pytest_root:
        - pytest/e2e_smoke.py
      pytest_args:
        - "--dut-scope=session"
    extra_args:
      - dmc_CONFIG_DMC_RUN_SMBUS_TESTS=y
      - CONFIG_ASSERT=y
  app.tracing:
    build_only: true
    sysbuild: true
    tags:
      - build-ci
    extra_overlay_confs:
      - tracing.conf
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=tracing.overlay
  app.tt_shell:
    build_only: true
    sysbuild: false
    tags:
      - build-ci
    extra_configs:
      - CONFIG_SHELL=y
