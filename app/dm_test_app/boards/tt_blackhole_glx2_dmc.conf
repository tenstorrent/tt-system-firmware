# GLX2 exposes the interactive shell through SEGGER RTT rather than UART.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_PROMPT_UART=""
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_PROMPT_RTT="dm_test_app:~$ "
CONFIG_SHELL_ECHO_STATUS=n
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_RTT=n
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_SECTION_NONE=y
CONFIG_FLASH_JESD216_API=y

# RTT down buffer sized for a 1024-byte bulk transfer as hex.
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=2304

# SMBus shell. SMBus initialises after I2C.
CONFIG_SMBUS=y
CONFIG_SMBUS_SHELL=y
CONFIG_SMBUS_INIT_PRIORITY=60
