# I3C, as a controller, plus OCCP over it.
#
# These were shared in prj.conf until tt_blackhole_glx2_dmc became a second
# board target and opted out of I3C; shared, they would go invisible and warn on
# that build. This file keeps the nucleo exactly where it was.
#
# The nucleo genuinely needs them: nucleo_u385rg_q.overlay (at the app root,
# picked up by Zephyr's application-directory fallback because there is no
# boards/nucleo_u385rg_q.overlay) enables i3c1 and i3c2 and puts a
# tenstorrent,smc-remoteproc node on i3c2.
#
# Only the Kconfig lives here. Adding this file does NOT affect discovery of
# that root overlay -- the .conf and .overlay searches are independent, and the
# conf search has no application-directory fallback step at all. Adding
# boards/nucleo_u385rg_q.overlay, on the other hand, WOULD silently displace it.
CONFIG_I3C=y
CONFIG_I3C_DUAL_ROLE=y
CONFIG_I3C_USE_IBI=n
CONFIG_I3C_SHELL=y
CONFIG_OCCP=y
CONFIG_OCCP_BACKEND_I3C=y

CONFIG_I3C_LOG_LEVEL_DBG=y
CONFIG_I3C_STM32_LOG_LEVEL_DBG=y
