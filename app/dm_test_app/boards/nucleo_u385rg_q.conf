# Enable RTT shell.
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_SECTION_NONE=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_RTT=n

# RTT buffers sized for a 1024-byte bulk transfer as hex.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=3072
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=2304

# SMBus shell. SMBus initialises after I2C.
CONFIG_SMBUS=y
CONFIG_SMBUS_SHELL=y
CONFIG_SMBUS_INIT_PRIORITY=60
