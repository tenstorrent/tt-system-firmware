# Driver configuration
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I3C=y
CONFIG_I3C_DUAL_ROLE=y
CONFIG_I3C_USE_IBI=n
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_OCCP=y
CONFIG_OCCP_BACKEND_I3C=y

# Debug Configuration
CONFIG_DEBUG=y

# Disable watchdog for debugging
CONFIG_WATCHDOG=n

# Logging
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_I3C_LOG_LEVEL_DBG=y
CONFIG_I3C_STM32_LOG_LEVEL_DBG=y
CONFIG_KERNEL_LOG_LEVEL_OFF=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_BUFFER_SIZE=32768

# create build/zephyr/zephyr.lst
CONFIG_OUTPUT_DISASSEMBLY=y

# Second shell on USB CDC ACM.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_TT_USB_SHELL=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="MK DMC shell"
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Tenstorrent"
CONFIG_UART_LINE_CTRL=y

# USB logs at DBG flood the UART shell.
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# Shell configuration
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_SHELL_HELP=y

# History off: bulk command lines do not fit in it.
CONFIG_SHELL_HISTORY=n

# Sized for a 1024-byte bulk transfer as hex.
CONFIG_SHELL_ARGC_MAX=70
CONFIG_SHELL_CMD_BUFF_SIZE=2304
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=2304
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=512

CONFIG_SHELL_STACK_SIZE=3072

CONFIG_I2C_SHELL_BUFFER_SIZE=64

# Shell subsystems
CONFIG_GPIO_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_I3C_SHELL=y
CONFIG_SPI_SHELL=y
CONFIG_FLASH_SHELL=y
CONFIG_LOG_CMDS=y

# BRING-UP: display subsystem so the maxim,max7219 driver is actually built.
# Without CONFIG_DISPLAY the DT node compiles no driver at all, so nothing ever
# initialises the MAX7221 (U67) and its registers stay at power-on defaults.
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
