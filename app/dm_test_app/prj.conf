# Driver configuration
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I3C=y
CONFIG_I3C_DUAL_ROLE=y
CONFIG_I3C_USE_IBI=n
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_OCCP=y
CONFIG_OCCP_BACKEND_I3C=y

# Debug Configuration
CONFIG_DEBUG=y

# Disable watchdog for debugging
CONFIG_WATCHDOG=n

# Logging
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_I3C_LOG_LEVEL_DBG=y
CONFIG_I3C_STM32_LOG_LEVEL_DBG=y
CONFIG_KERNEL_LOG_LEVEL_OFF=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_BUFFER_SIZE=32768

# create build/zephyr/zephyr.lst
CONFIG_OUTPUT_DISASSEMBLY=y

# USB device: the board's USB-C port goes straight to the STM32 (PA11/PA12), so
# expose it as a CDC ACM serial port and run a second shell on it. The UART shell
# on uart4 (FTDI) is untouched -- both work at once, see usb_shell.c.
#
# INITIALIZE_AT_BOOT builds the whole USBD context (descriptors, configuration,
# usbd_init + usbd_enable) around the first zephyr,cdc-acm-uart under
# zephyr_udc0, so the app needs no USB setup code of its own.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="MK DMC shell"
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Tenstorrent"
CONFIG_UART_LINE_CTRL=y

# This app runs the whole log subsystem at DBG (below). Left there, USB
# enumeration alone emits hundreds of lines per plug-in over the 115200 console,
# which is slow enough to disturb the enumeration it is reporting on. Pin the USB
# modules to warnings so real faults still show up.
#
# UDC_DRIVER matters as much as the other two: udc_stm32.c logs "DataIn ep 0x%02x"
# at DBG on *every* IN transfer, and the console is uart4 -- which is also the
# shell backend. Left at DBG, driving the USB shell sprays log lines into the
# FTDI shell's replies, where a partial line ("ataIn ep 0x80") does not match the
# host's log-line filter and lands inside a command's output instead.
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# Shell configuration
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_SHELL_HELP=y

# History off. Not for the RAM -- 512 bytes per instance is nothing on a 256 KB
# part -- but because at the command lengths below it stores nothing useful: one
# `bulk` line is up to ~2 KB, so a 512-byte heap holds zero of them and evicts
# the short commands that were in there. Costs up-arrow recall on the
# interactive FTDI shell; delete this line to get it back.
CONFIG_SHELL_HISTORY=n

# Transfer sizing. Upstream's i2c/i3c/spi shells spend one argv token per
# payload byte, so ARGC_MAX -- not the bus, and not the driver buffer -- is what
# caps a transfer: at the stock 20 that is 15 bytes for `i2c write` and 17 for
# `spi transceive`. boardy measured the wall from the other side and pinned
# DMCShellSPI.SAFE_FRAME_BYTES at 14 to stay clear of it.
#
# Two changes together. These four raise the tokenised path (src/bulk_shell.c
# then removes the per-byte encoding entirely, and is bounded by CMD_BUFF_SIZE
# alone):
#
#   ARGC_MAX 70          -> 64-byte `i2c write`, and 32 for `spi transceive`,
#                           which is hard-capped at MIN(ARGC_MAX-2, 32) in
#                           drivers/spi/spi_shell.c. 253 is the ceiling for any
#                           of this: the `optional` count in struct
#                           shell_static_args is a uint8_t whose 0xFE/0xFF are
#                           SHELL_OPT_ARG_RAW/CHECK_SKIP (SHELL_OPT_ARG_MAX).
#   CMD_BUFF_SIZE 2304   -> 1024 payload bytes as 2048 hex characters, plus
#                           room for `bulk i2c writeread i2c1 0x50 ... 1024`.
#                           Costs 2 buffers (cmd_buff + temp_buff) per shell
#                           instance, and this app runs two, so 4 x 2304.
#   RX_RING 2304         -> the default is 64, which is smaller than one bulk
#                           command line. Over the FTDI at 115200 a 2 KB line
#                           arrives spread over ~180 ms and the shell thread
#                           keeps up regardless; over USB the host delivers it
#                           as a burst and the ring is what has to absorb it.
#   TX_RING 512          -> default 8. A `RX 1024 <hex>` reply is ~2 KB, and
#                           this is how much of it goes out per interrupt.
CONFIG_SHELL_ARGC_MAX=70
CONFIG_SHELL_CMD_BUFF_SIZE=2304
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=2304
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=512

# argv[CONFIG_SHELL_ARGC_MAX + 1] lives on the shell thread stack (twice over:
# shell.c's execute() and tab_handle()), so ARGC_MAX 70 spends 284 bytes of the
# 2048 default. bulk_shell.c keeps its own buffers static precisely so they do
# not land here, but leave margin -- there are two of these threads.
CONFIG_SHELL_STACK_SIZE=3072

# Sizes buf[] in drivers/i2c/i2c_shell.c for `i2c read`/`i2c write`. The
# register address is charged against it (`i2c write` truncates when
# data_length + reg_addr_bytes > this), so a 1-byte register leaves 63.
CONFIG_I2C_SHELL_BUFFER_SIZE=64

# Shell subsystems
CONFIG_GPIO_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_I3C_SHELL=y
CONFIG_SPI_SHELL=y
CONFIG_FLASH_SHELL=y
CONFIG_LOG_CMDS=y

# BRING-UP: display subsystem so the maxim,max7219 driver is actually built.
# Without CONFIG_DISPLAY the DT node compiles no driver at all, so nothing ever
# initialises the MAX7221 (U67) and its registers stay at power-on defaults.
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
